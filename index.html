<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- Preload local fonts — served from same origin, fastest possible -->
    <link rel="preload" href="/src/assets/fonts/anakotmai-medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/anakotmai-bold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Prefetch Google Fonts connection only — avoids render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking Google Fonts (Inter) — media=print trick loads async -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" /></noscript>
    <!-- Preconnect to Unsplash CDN (used for all images) -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>ประชาชลชาย — พรรคเพื่อประชาชน</title>
    <meta name="description" content="พรรคประชาชลชาย — นโยบายเพื่อประชาชน โปร่งใส ยั่งยืน เพื่ออนาคตที่ดีกว่าของทุกคน" />
    <meta name="theme-color" content="#111827" />
    <!-- U-01 Fix: Pre-resolve language BEFORE React mounts to eliminate FOUC -->
    <script>
      try {
        var _l = localStorage.getItem('app_lang');
        if (!_l) {
          _l = (navigator.language || navigator.userLanguage || '').toLowerCase().startsWith('th') ? 'th' : 'en';
        }
        document.documentElement.setAttribute('data-lang', _l);
      } catch(e) {}
    </script>
  </head>
  <style>
    #global-preloader {
      position: fixed;
      inset: 0;
      background-color: #0b0f17; /* Dark theme background */
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 107, 0, 0.15);
      border-top-color: #FF6B00;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .preloader-hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
  <body>
    <div id="global-preloader">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Run preloader hide logic on load, completely independent of React
      const hidePreloader = () => {
        setTimeout(() => {
          const preloader = document.getElementById('global-preloader');
          if (preloader) {
            preloader.classList.add('preloader-hidden');
            setTimeout(() => preloader.remove(), 600);
          }
        }, 1200); // 1.2s delay
      };

      if (document.readyState === 'complete') {
        hidePreloader();
      } else {
        window.addEventListener('load', hidePreloader);
      }
    </script>
  </body>
</html>
